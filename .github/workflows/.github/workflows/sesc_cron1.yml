name: Radar Sesc SP

on:
  schedule:
    # Terças e Sextas às 09h00 (Horário de Brasília = 12h00 UTC)
    - cron: '0 12 * * 2,5'
  workflow_dispatch: # Permite disparar na hora com 1 clique no GitHub

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Rodar Radar Sesc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python sesc_agent.py
